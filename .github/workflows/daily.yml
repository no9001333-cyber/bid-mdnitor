name: 매일 입찰공고 수집
 
on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 8시 = UTC 전날 23시
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # "Run workflow" 버튼으로 수동 실행도 가능
 
permissions:
  contents: write
 
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
 
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: 의존성 설치
        run: pip install -r requirements.txt
 
      - name: 공고 수집 + 대시보드 생성
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          LH_SERVICE_KEY: ${{ secrets.LH_SERVICE_KEY }}
          D2B_SERVICE_KEY: ${{ secrets.D2B_SERVICE_KEY }}
          KWATER_SERVICE_KEY: ${{ secrets.KWATER_SERVICE_KEY }}
          KEPCO_API_KEY: ${{ secrets.KEPCO_API_KEY }}
          KORAIL_SERVICE_KEY: ${{ secrets.KORAIL_SERVICE_KEY }}
        run: python main.py
 
      - name: 변경사항 커밋
        run: |
          git config user.name "bid-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/bids.json docs/index.html
          git diff --quiet --cached || git commit -m "chore: 자동 공고 업데이트 $(date +'%Y-%m-%d %H:%M')"
          git push
 
